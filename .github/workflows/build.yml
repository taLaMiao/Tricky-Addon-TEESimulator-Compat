name: build

on:
  push:
    branches:
      - main
      - fork
    paths:
      - 'module/**'
      - 'webui/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'module/**'
      - 'webui/**'
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build WebUI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm build

      - name: Extract module info
        id: info
        run: |
          MODULE_VERSION=$(grep '^version=' module/module.prop | sed 's/version=//')
          COMMIT_NUM=$(git rev-list --count HEAD)
          BUILD_COUNT=${{ github.run_number }}
          ARTIFACT_NAME="TrickyAddon-TEESimulator-Compat-${MODULE_VERSION}-${COMMIT_NUM}"
          sed -i "s/^version=.*/& (${COMMIT_NUM}${BUILD_COUNT})/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${COMMIT_NUM}/" module/module.prop
          echo "MODULE_VERSION=${MODULE_VERSION}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
          echo "COMMIT_NUM=${COMMIT_NUM}" >> $GITHUB_ENV

      - name: Package module zip
        run: |
          cd module
          zip -r9 "../${ARTIFACT_NAME}.zip" .
          cd ..
          ls -lh "${ARTIFACT_NAME}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip

      - name: Create rolling "latest" pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fork')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (rolling)"
          body: |
            Auto-built from commit ${{ github.sha }}
            Module version: ${{ env.MODULE_VERSION }}
            Commit count: ${{ env.COMMIT_NUM }}

            Flash via KSU/APatch/Magisk manager.
          prerelease: true
          files: ${{ env.ARTIFACT_NAME }}.zip
          fail_on_unmatched_files: true
